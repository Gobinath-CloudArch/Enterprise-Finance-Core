<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gobinath Family Expense — Enterprise Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* --- Dynamic Enterprise Theming System --- */
    :root[data-theme="dark"] { 
      --bg-color: #070b14; 
      --bg-img: linear-gradient(rgba(7, 11, 20, 0.92), rgba(7, 11, 20, 0.92)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop'); 
      --sidebar: rgba(9, 15, 29, 0.7); 
      --panel: rgba(14, 21, 38, 0.75); 
      --border: rgba(30, 46, 78, 0.8); 
      --text: #f3f7fd; 
      --muted: #8598b8; 
      --glass-blur: 16px; 
      --primary: #4f6bf7; 
      --primary-hover: #3d58e3; 
    }
    
    :root[data-theme="light"] { 
      --bg-color: #f4f7f9; 
      --bg-img: linear-gradient(rgba(244, 247, 249, 0.88), rgba(244, 247, 249, 0.88)), url('https://images.unsplash.com/photo-1557682250-33bd709cbe85?q=80&w=2000&auto=format&fit=crop'); 
      --sidebar: rgba(255, 255, 255, 0.6); 
      --panel: rgba(255, 255, 255, 0.7); 
      --border: rgba(225, 229, 235, 0.8); 
      --text: #1a202c; 
      --muted: #718096; 
      --glass-blur: 16px; 
      --primary: #4f6bf7; 
      --primary-hover: #3d58e3; 
    }
    
    :root[data-theme="neo-glass"] { 
      --bg-color: #0f172a; 
      --bg-img: radial-gradient(at 0% 0%, rgba(56, 30, 114, 0.4) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.4) 0px, transparent 50%); 
      --sidebar: rgba(15, 23, 42, 0.4); 
      --panel: rgba(17, 24, 39, 0.5); 
      --border: rgba(255, 255, 255, 0.1); 
      --text: #ffffff; 
      --muted: #94a3b8; 
      --glass-blur: 16px; 
      --primary: #4f6bf7; 
      --primary-hover: #3d58e3; 
    }
    
    :root[data-theme="love"] { 
      --bg-color: #1a050a; 
      --bg-img: linear-gradient(rgba(26, 5, 10, 0.88), rgba(26, 5, 10, 0.88)), url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=2000&auto=format&fit=crop'); 
      --sidebar: rgba(40, 10, 20, 0.5); 
      --panel: rgba(60, 15, 30, 0.6); 
      --border: rgba(255, 77, 109, 0.25); 
      --text: #ffe0e6; 
      --muted: #ffb3c6; 
      --glass-blur: 16px; 
      --primary: #ff4d6d; 
      --primary-hover: #c9184a; 
    }
    
    :root { 
      --green: #2ed573; 
      --red: #ff5263; 
      --warn: #fbc531; 
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background-color: var(--bg-color); 
      background-image: var(--bg-img); 
      background-attachment: fixed; 
      background-size: cover; 
      background-position: center; 
      color: var(--text); 
      display: flex; 
      min-height: 100vh; 
      overflow-x: hidden; 
      transition: background 0.3s, color 0.3s; 
    }

    /* --- LAYOUT & CONTAINERS --- */
    .sidebar { 
      width: 260px; 
      background: var(--sidebar); 
      border-right: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      padding: 24px 16px; 
      backdrop-filter: blur(var(--glass-blur)); 
      -webkit-backdrop-filter: blur(var(--glass-blur)); 
      transition: 0.3s; 
      z-index: 1000; 
    }
    
    .main { 
      flex: 1; 
      padding: 28px 32px; 
      overflow-y: auto; 
    }
    
    .panel { 
      background: var(--panel); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 22px; 
      margin-bottom: 24px; 
      backdrop-filter: blur(var(--glass-blur)); 
      -webkit-backdrop-filter: blur(var(--glass-blur)); 
      box-shadow: 0 8px 32px rgba(0,0,0,0.15); 
    }

    /* --- BRANDING --- */
    .brand-box { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 0 8px 24px; 
      border-bottom: 1px solid var(--border); 
      margin-bottom: 20px; 
    }
    
    .brand-icon { 
      width: 38px; 
      height: 38px; 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      border-radius: 10px; 
      display: grid; 
      place-items: center; 
      font-weight: 800; 
      font-size: 18px; 
      color: #fff; 
    }
    
    .brand-title { 
      font-size: 15px; 
      font-weight: 700; 
      line-height: 1.2; 
    }
    
    /* --- NAVIGATION --- */
    .nav-list { 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      flex: 1; 
    }
    
    .nav-item { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 12px 14px; 
      border-radius: 12px; 
      color: var(--muted); 
      font-size: 13.5px; 
      font-weight: 600; 
      background: transparent; 
      border: 1px solid transparent; 
      cursor: pointer; 
      text-align: left; 
      transition: 0.2s; 
    }
    
    .nav-item:hover { 
      color: var(--text); 
      background: rgba(255,255,255,0.08); 
    }
    
    .nav-item.active { 
      background: rgba(255,255,255,0.1); 
      color: var(--primary); 
      border-color: var(--border); 
    }

    /* --- BUTTONS & CONTROLS --- */
    .panel-head { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 18px; 
    }
    
    .btn { 
      padding: 10px 18px; 
      border-radius: 10px; 
      font-weight: 600; 
      font-size: 13.5px; 
      border: 1px solid var(--border); 
      background: rgba(0,0,0,0.2); 
      color: var(--text); 
      cursor: pointer; 
      transition: 0.2s; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
    }
    
    .btn.primary { 
      background: var(--primary); 
      border: none; 
      color: white; 
    }
    
    .btn:hover:not(:disabled) { 
      filter: brightness(1.15); 
    }
    
    .btn:disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
    }
    
    .btn.voice-pulse { 
      background: var(--red) !important; 
      color: white !important; 
      border-color: var(--red) !important; 
      animation: pulseAnim 1.2s infinite; 
    }
    
    @keyframes pulseAnim { 
      0% { box-shadow: 0 0 0 0 rgba(255, 82, 99, 0.7); } 
      70% { box-shadow: 0 0 0 10px rgba(255, 82, 99, 0); } 
      100% { box-shadow: 0 0 0 0 rgba(255, 82, 99, 0); } 
    }

    .table-controls { 
      display: flex; 
      gap: 12px; 
      margin-bottom: 16px; 
    }
    
    .input-field { 
      width: 100%; 
      padding: 10px 14px; 
      border-radius: 10px; 
      border: 1px solid var(--border); 
      background: rgba(0,0,0,0.3); 
      color: var(--text); 
      outline: none; 
      font-size: 14px; 
      backdrop-filter: blur(4px); 
    }
    
    .input-field:focus { 
      border-color: var(--primary); 
    }
    
    select.input-field option { 
      background-color: #0f172a; 
      color: #fff; 
    }
    
    /* --- TABLES --- */
    .table-responsive { 
      overflow-x: auto; 
      width: 100%; 
    }
    
    table { 
      width: 100%; 
      border-collapse: collapse; 
      text-align: left; 
      font-size: 13px; 
      min-width: 600px; 
    }
    
    th { 
      color: var(--muted); 
      padding: 12px 10px; 
      border-bottom: 1px solid var(--border); 
      font-size: 11px; 
      text-transform: uppercase; 
      cursor: pointer; 
      user-select: none; 
    }
    
    th:hover { color: var(--text); }
    
    td { 
      padding: 14px 10px; 
      border-bottom: 1px solid var(--border); 
    }
    
    .badge { 
      padding: 4px 8px; 
      border-radius: 6px; 
      font-size: 10.5px; 
      font-weight: 700; 
      white-space: nowrap; 
    }
    
    .badge.debit { background: rgba(255,82,99,0.15); color: var(--red); }
    .badge.credit { background: rgba(46,213,115,0.15); color: var(--green); }
    .badge.warn { background: rgba(251,197,49,0.15); color: var(--warn); }
    .badge.primary { background: rgba(79, 107, 247, 0.15); color: var(--primary); }

    /* --- CHARTS & COMPONENTS --- */
    .chart-container { 
      height: 300px; 
      width: 100%; 
      margin-bottom: 20px; 
    }
    
    .modern-clock-box { 
      border: 1px solid var(--primary); 
      border-radius: 16px; 
      padding: 16px 28px; 
      text-align: right; 
      background: rgba(0, 0, 0, 0.35); 
      backdrop-filter: blur(8px); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
    }
    
    .modern-time { 
      font-size: 46px; 
      font-weight: 800; 
      letter-spacing: 2px; 
      font-variant-numeric: tabular-nums; 
      color: var(--text); 
      line-height: 1; 
      margin-bottom: 6px; 
    }
    
    .modern-time span { 
      font-size: 24px; 
      font-weight: 700; 
      text-transform: lowercase; 
    }
    
    .modern-date { 
      color: var(--primary); 
      font-weight: 700; 
      font-size: 14.5px; 
      letter-spacing: 0.5px; 
    }
    
    .budget-row { margin-bottom: 16px; }
    .budget-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-val { font-size: 26px; font-weight: 800; }

    /* --- MODALS --- */
    .modal-overlay { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.7); 
      backdrop-filter: blur(8px); 
      display: none; 
      place-items: center; 
      z-index: 2000; 
    }
    
    .modal { 
      background: var(--panel); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      width: 100%; 
      max-width: 550px; 
      padding: 24px; 
      backdrop-filter: blur(var(--glass-blur)); 
      max-height: 90vh; 
      overflow-y: auto; 
    }
    
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-head h3 { font-size: 18px; font-weight: 700; }
    .close-btn { background: none; border: none; font-size: 24px; color: var(--muted); cursor: pointer; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 700; }

    .quick-tile { 
      background: rgba(255,255,255,0.03); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 30px 20px; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.2s; 
      backdrop-filter: blur(var(--glass-blur)); 
    }
    
    .quick-tile:hover { 
      transform: translateY(-3px); 
      background: rgba(255,255,255,0.08); 
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
    }
    
    .reminder-card { 
      background: rgba(0,0,0,0.25); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 14px; 
      min-width: 220px; 
      flex-shrink: 0; 
    }

    /* --- MOBILE RESPONSIVENESS --- */
    @media (max-width: 850px) {
      body { flex-direction: column; }
      .sidebar { 
        position: fixed; 
        bottom: 0; 
        width: 100%; 
        height: 75px; 
        flex-direction: row; 
        padding: 0; 
        border-right: none; 
        border-top: 1px solid var(--border); 
      }
      .brand-box { display: none; }
      .nav-list { 
        flex-direction: row; 
        width: 100%; 
        overflow-x: auto; 
        padding: 0 10px; 
        align-items: center; 
        justify-content: flex-start; 
        -ms-overflow-style: none; 
        scrollbar-width: none; 
      }
      .nav-list::-webkit-scrollbar { display: none; }
      .nav-item { 
        flex-direction: column; 
        font-size: 10px; 
        gap: 6px; 
        padding: 8px 14px; 
        white-space: nowrap; 
        border: none; 
        border-radius: 8px; 
      }
      .nav-item .nav-text { display: block; }
      .main { padding: 16px; padding-bottom: 90px; }
      .grid-2 { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: 1fr; }
      .modern-clock-box { width: 100%; text-align: center; padding: 12px; margin-top: 10px; }
      .panel-head { flex-direction: column; align-items: flex-start; gap: 12px; }
      .table-controls { flex-direction: column; }
      .modal { padding: 16px; margin: 10px; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <aside class="sidebar">
    <div class="brand-box">
      <div class="brand-icon">E</div>
      <div class="brand-title">Client Workspace<br><span style="font-size:11px; color:var(--muted); font-weight:400;">Finance Engine</span></div>
    </div>
    <nav class="nav-list">
      <button class="nav-item active" onclick="navigate('home', this)">
        <span class="nav-icon">🏠</span><span class="nav-text">Home</span>
      </button>
      <button class="nav-item" onclick="navigate('overview', this)">
        <span class="nav-icon">⌂</span><span class="nav-text">Overview</span>
      </button>
      <button class="nav-item" onclick="navigate('records', this)">
        <span class="nav-icon">▤</span><span class="nav-text">Records</span>
      </button>
      <button class="nav-item" onclick="navigate('analyzer', this)">
        <span class="nav-icon">📈</span><span class="nav-text">Analyzer</span>
      </button>
      <button class="nav-item" onclick="navigate('budget', this)">
        <span class="nav-icon">🎯</span><span class="nav-text">Budget</span>
      </button>
      <button class="nav-item" onclick="navigate('reminders', this)">
        <span class="nav-icon">🔔</span><span class="nav-text">Reminders</span>
      </button>
      <button class="nav-item" onclick="navigate('statements', this)">
        <span class="nav-icon">📥</span><span class="nav-text">Import/Export</span>
      </button>
      <button class="nav-item" onclick="navigate('settings', this)">
        <span class="nav-icon">⚙</span><span class="nav-text">Settings</span>
      </button>
    </nav>
  </aside>

  <!-- Main View -->
  <main class="main">
    <div style="display:flex; justify-content:space-between; margin-bottom: 24px; align-items:center; flex-wrap:wrap; gap:12px;">
      <div>
        <h2 id="view-title">Home</h2>
        <p id="view-sub" style="color:var(--muted); font-size:13px; margin-top:4px;">Welcome and quick actions.</p>
      </div>
      <div style="display: flex; gap: 10px; align-items:center; flex-wrap:wrap;">
        <button class="btn" onclick="logout()" style="border-color:var(--red); color:var(--red);">🚪 Logout</button>
        <button class="btn" id="voice-top-btn" onclick="startVoiceAssistant()">🎙️ Voice Add</button>
        <button class="btn" onclick="openTxModal('CREDIT')" style="border-color:var(--green); color:var(--green);">+ Add Income</button>
        <button class="btn primary" onclick="openTxModal('DEBIT')">+ Add Expense</button>
      </div>
    </div>
    
    <div id="view-container"></div>
  </main>

  <!-- Transaction Modal (Add/Edit) -->
  <div id="tx-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="tx-modal-title">Add Transaction</h3>
        <div style="display:flex; align-items:center; gap:8px;">
          <button type="button" class="btn" id="voice-modal-btn" onclick="startVoiceAssistant()" style="padding:6px 12px; font-size:12px; border-color:var(--primary);">🎙️ Speak</button>
          <button class="close-btn" onclick="closeModal('tx-modal')">×</button>
        </div>
      </div>
      <form id="tx-form" onsubmit="saveTx(event)">
        <input type="hidden" id="tx-id">
        <div class="grid-2">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="tx-date" class="input-field" required>
          </div>
          <div class="form-group">
            <label>Type</label>
            <select id="tx-type" class="input-field" onchange="updateCatOptions()">
              <option value="DEBIT">Expense (Debit)</option>
              <option value="CREDIT">Income (Credit)</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Category</label>
            <select id="tx-category" class="input-field" required></select>
          </div>
          <div class="form-group">
            <label>Payment Method</label>
            <select id="tx-method" class="input-field">
              <option value="UPI">UPI / NetBanking</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Debit Card">Debit Card</option>
              <option value="Cash">Cash</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="tx-desc" class="input-field" placeholder="e.g. Supermarket, Salary..." required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Amount</label>
            <input type="number" id="tx-amount" step="0.01" class="input-field" required>
          </div>
          <div class="form-group">
            <label>User</label>
            <select id="tx-user" class="input-field"></select>
          </div>
        </div>
        <div class="form-group">
          <label>Additional Notes</label>
          <input type="text" id="tx-notes" class="input-field" placeholder="Optional details...">
        </div>
        <button type="submit" class="btn primary" style="width: 100%; margin-top: 10px;" id="tx-save-btn">Save Transaction</button>
      </form>
    </div>
  </div>

  <!-- Budget Edit Modal -->
  <div id="budget-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <h3>Configure Budget</h3>
        <button class="close-btn" onclick="closeModal('budget-modal')">×</button>
      </div>
      <form onsubmit="saveBudget(event)">
        <div class="form-group">
          <label>Category</label>
          <select id="budget-cat" class="input-field"></select>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Limit Type</label>
            <select id="budget-type" class="input-field">
              <option value="Fixed">Fixed Amount</option>
              <option value="Percentage">Percentage (%) of Income</option>
            </select>
          </div>
          <div class="form-group">
            <label>Value</label>
            <input type="number" id="budget-val" class="input-field" required>
          </div>
        </div>
        <button type="submit" class="btn primary" style="width: 100%; margin-top: 10px;">Set Budget</button>
      </form>
    </div>
  </div>

  <!-- Reminder Add Modal -->
  <div id="rem-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <h3>Add Reminder / Scheduled Payment</h3>
        <button class="close-btn" onclick="closeModal('rem-modal')">×</button>
      </div>
      <form onsubmit="saveReminder(event)">
        <input type="hidden" id="rem-id">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="rem-title" class="input-field" required placeholder="e.g. Car EMI, Anniversary">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="rem-date" class="input-field" required>
          </div>
          <div class="form-group">
            <label>Category / Type</label>
            <select id="rem-type" class="input-field">
              <option value="Important Date">Important Date</option>
              <option value="Scheduled Payment">Scheduled Payment</option>
              <option value="Bill Due">Bill Due</option>
              <option value="Subscription Renewal">Subscription Renewal</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Expected Amount (Optional)</label>
          <input type="number" id="rem-amount" class="input-field" placeholder="0.00" step="0.01">
        </div>
        <button type="submit" class="btn primary" style="width: 100%; margin-top: 10px;">Save Reminder</button>
      </form>
    </div>
  </div>

  <script>
    // --- MASTER CONFIGURATION ---
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUVBaa12pNHMbvSYfl6h_3PjxfxheyDjGEh47HHrfoTGPvlKnmaHmoA1yJAeZJ1vA/exec";

    // --- GLOBAL CLOCK ---
    setInterval(() => {
      const timeEl = document.getElementById('live-time');
      const dateEl = document.getElementById('live-date');
      
      if (timeEl && dateEl) {
        const now = new Date();
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12; 
        hours = hours ? hours : 12; 
        const mins = now.getMinutes().toString().padStart(2, '0');
        const secs = now.getSeconds().toString().padStart(2, '0');
        timeEl.innerHTML = `${hours.toString().padStart(2, '0')}:${mins}:${secs} <span>${ampm}</span>`;
        dateEl.innerText = now.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      }
    }, 1000);

    // --- LOCAL OFFLINE STATE & INITIALIZATION ---
    let currentTheme = localStorage.getItem('core_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);

    const expCategories = [
        'Rent Paid', 'Groceries', 'Electricity (EB)', 'Fuel / Petrol', 
        'Dining Out', 'Parking', 'Snacks', 'Credit Card Bill', 
        'Loan Repayment', 'Maintenance', 'Medical', 
        'Utility Bills', 'Shopping', 'Other Expense'
    ];
    
    const incCategories = [
        'Salary Received', 'Rent Received', 'Bonus', 'Reimbursement', 'Loan Disbursed'
    ];

    let ledger = [];
    let users = JSON.parse(localStorage.getItem('core_users')) || ['Admin', 'User 2'];
    let budgets = JSON.parse(localStorage.getItem('core_budgets')) || { 
        'Groceries': { type: 'Fixed', val: 15000 }, 
        'Credit Card Bill': { type: 'Percentage', val: 15 } 
    };
    let reminders = [];

    let sortCol = 'date';
    let sortAsc = false;
    let selectedMonthA = new Date().toISOString().slice(0,7);
    let selectedMonthB = new Date().toISOString().slice(0,7);

    // --- ADVANCED DATA SANITIZATION & DEDUPLICATION WITH STRICT ID INDEXING ---
    function deduplicateLedger(txList) {
        if (!txList || !Array.isArray(txList)) return [];
        const map = new Map();
        
        for (const tx of txList) {
            if (!tx || !tx.id) continue;
            if (tx.date && tx.date.includes('T')) tx.date = tx.date.split('T')[0];
            map.set(String(tx.id).trim(), tx);
        }
        return Array.from(map.values()).sort((a,b) => new Date(b.date) - new Date(a.date));
    }

    function deduplicateReminders(remList) {
        if (!remList || !Array.isArray(remList)) return [];
        const map = new Map();
        
        for (const r of remList) {
            if (!r || !r.id) continue;
            if (r.date && r.date.includes('T')) r.date = r.date.split('T')[0];
            map.set(String(r.id).trim(), r);
        }
        return Array.from(map.values()).sort((a,b) => new Date(a.date) - new Date(b.date));
    }

    // --- CLOUD SYNC ENGINE ---
    let isSyncing = false;

    function apiGetJSONP(action) {
      return new Promise((resolve, reject) => {
        if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.startsWith("YOUR")) return reject(new Error("Missing URL"));
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        window[callbackName] = function(data) {
          delete window[callbackName];
          document.body.removeChild(script);
          if (data.error) reject(new Error(data.error));
          else resolve(data);
        };
        const script = document.createElement('script');
        script.src = `${APPS_SCRIPT_URL}?action=${action}&callback=${callbackName}`;
        script.onerror = () => reject(new Error("Network Error"));
        document.body.appendChild(script);
      });
    }

    async function apiPost(action, data) {
       try {
           await fetch(APPS_SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action, data })
           });
           return { ok: true };
       } catch (err) {
           console.warn("Post error", err);
           return { ok: false };
       }
    }

    // --- GLOBAL ENTERPRISE MASTER SYNC (PUSH + PULL) ---
    async function backgroundSync(isBoot = false) {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.startsWith("YOUR")) return;
      if (isSyncing) return;
      isSyncing = true;

      try {
        if (isBoot) {
            document.getElementById('view-container').innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:50vh; text-align:center;">
                    <div style="width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
                    <h3 style="color:var(--primary); font-size:22px; margin-bottom:8px;">☁️ Enterprise Cloud Sync</h3>
                    <p style="color:var(--muted); font-size:14px;">Establishing secure connection to Master Storage...</p>
                    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
                </div>`;
        }

        const cloudData = await apiGetJSONP('getDashboard');
        
        let cloudTxs = deduplicateLedger(cloudData.transactions || []);
        let cloudRems = deduplicateReminders(cloudData.reminders || []);
        
        const cloudTxIds = new Set(cloudTxs.map(t => String(t.id).trim()));
        const cloudRemIds = new Set(cloudRems.map(r => String(r.id).trim()));
        
        let localTxs = deduplicateLedger(JSON.parse(localStorage.getItem('core_ledger')) || []);
        let localRems = deduplicateReminders(JSON.parse(localStorage.getItem('core_reminders')) || []);

        const missingInCloud = localTxs.filter(t => !cloudTxIds.has(String(t.id).trim()));
        const missingRems = localRems.filter(r => !cloudRemIds.has(String(r.id).trim()));

        let requiresRefresh = false;

        if (missingInCloud.length > 0 || missingRems.length > 0) {
           for (const tx of missingInCloud) await apiPost('addTransaction', tx);
           for (const r of missingRems) await apiPost('addReminder', r);
           
           const finalCloudData = await apiGetJSONP('getDashboard');
           ledger = deduplicateLedger(finalCloudData.transactions || []);
           reminders = deduplicateReminders(finalCloudData.reminders || []);
           requiresRefresh = true;
        } else {
           if (cloudTxs.length !== localTxs.length || cloudRems.length !== localRems.length) {
               requiresRefresh = true;
           }
           ledger = cloudTxs;
           reminders = cloudRems;
        }
        
        localStorage.setItem('core_ledger', JSON.stringify(ledger));
        localStorage.setItem('core_reminders', JSON.stringify(reminders));
        
        if (requiresRefresh || isBoot) {
            const activeNav = document.querySelector('.nav-item.active');
            if (activeNav) {
              const navText = activeNav.innerText.trim();
              if(navText.includes('Records')) navigate('records', activeNav);
              else if(navText.includes('Analyzer')) navigate('analyzer', activeNav);
              else if(navText.includes('Budget')) navigate('budget', activeNav);
              else if(navText.includes('Reminders')) navigate('reminders', activeNav);
              else navigate('home');
            } else {
                navigate('home');
            }
        }
      } catch(e) {
        console.warn("Background auto-sync silently skipped due to network.", e);
        if (isBoot) navigate('home'); 
      } finally {
          isSyncing = false;
      }
    }

    async function triggerManualSync() {
        const btn = document.getElementById('manual-sync-btn');
        if(btn) { btn.disabled = true; btn.innerText = "⏳ Syncing..."; }
        await backgroundSync(false);
        if(btn) { btn.disabled = false; btn.innerText = "🔄 Force Master Sync"; }
        alert("Sync complete. Dashboard is fully updated with Google Sheets.");
    }

    // --- OPTIMISTIC APP BOOT ---
    async function bootApp() {
      const localData = localStorage.getItem('core_ledger');
      const localRemData = localStorage.getItem('core_reminders');
      
      let isLocalEmpty = (!localData || JSON.parse(localData).length === 0);
      
      if (!isLocalEmpty) {
          ledger = deduplicateLedger(JSON.parse(localData));
          if (localRemData) reminders = deduplicateReminders(JSON.parse(localRemData));
      }

      if (APPS_SCRIPT_URL && !APPS_SCRIPT_URL.startsWith("YOUR")) {
          if (isLocalEmpty) {
              await backgroundSync(true);
          } else {
              navigate('home');
              backgroundSync(false);
          }
          setInterval(() => backgroundSync(false), 15000);
      } else {
          navigate('home');
      }
    }

    // --- VOICE ASSISTANT ENGINE ---
    function startVoiceAssistant() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) { 
          alert("Voice recognition is not supported in this browser."); 
          return; 
      }
      
      const recognition = new SpeechRecognition();
      recognition.continuous = false; 
      recognition.lang = 'en-US'; 
      recognition.interimResults = false;
      
      const topBtn = document.getElementById('voice-top-btn'); 
      const modalBtn = document.getElementById('voice-modal-btn');
      
      if (topBtn) { 
          topBtn.classList.add('voice-pulse'); 
          topBtn.innerText = "🛑 Listening..."; 
      }
      if (modalBtn) { 
          modalBtn.classList.add('voice-pulse'); 
          modalBtn.innerText = "🛑 Listening..."; 
      }
      
      recognition.onerror = (e) => { 
          alert("Could not catch speech. Please try again."); 
      };
      
      recognition.onend = () => {
        if (topBtn) { 
            topBtn.classList.remove('voice-pulse'); 
            topBtn.innerText = "🎙️ Voice Add"; 
        }
        if (modalBtn) { 
            modalBtn.classList.remove('voice-pulse'); 
            modalBtn.innerText = "🎙️ Speak"; 
        }
      };
      
      recognition.onresult = (event) => { 
          processVoiceCommand(event.results[0][0].transcript); 
      };
      
      recognition.start();
    }

    function processVoiceCommand(text) {
      const lower = text.toLowerCase();
      let type = 'DEBIT';
      
      if (lower.includes('credit') || lower.includes('income') || lower.includes('salary') || lower.includes('received') || lower.includes('refund') || lower.includes('bonus')) {
          type = 'CREDIT';
      }
      
      let amount = ''; 
      const amtMatch = lower.match(/(?:(?:rs\.?|rupees|inr|₹|\$)\s*)?(\d+(?:\.\d+)?)/i); 
      if (amtMatch) amount = parseFloat(amtMatch[1]);
      
      let method = 'UPI'; 
      if (lower.includes('credit card')) method = 'Credit Card'; 
      else if (lower.includes('debit card')) method = 'Debit Card'; 
      else if (lower.includes('cash')) method = 'Cash';
      
      const availableCategories = type === 'DEBIT' ? expCategories : incCategories;
      let category = availableCategories[0]; 
      
      const voiceCatMap = { 
          'grocery': 'Groceries', 'supermarket': 'Groceries', 
          'rent': type === 'CREDIT' ? 'Rent Received' : 'Rent Paid', 
          'electricity': 'Electricity (EB)', 'eb': 'Electricity (EB)', 
          'petrol': 'Fuel / Petrol', 'fuel': 'Fuel / Petrol', 
          'dining': 'Dining Out', 'restaurant': 'Dining Out', 
          'parking': 'Parking', 'snack': 'Snacks', 
          'credit card': 'Credit Card Bill', 'loan': 'Loan', 'emi': 'Loan', 'repayment': 'Loan Repayment',
          'saloon': 'Saloon / Parlour', 'lic': 'LIC Payment', 
          'utility': 'Utility Bills', 'salary': 'Salary Received', 'bonus': 'Bonus',
          'shopping': 'Shopping', 'amazon': 'Shopping', 'flipkart': 'Shopping', 'clothes': 'Shopping'
      };
      
      for (const [key, val] of Object.entries(voiceCatMap)) { 
          if (lower.includes(key) && availableCategories.includes(val)) { 
              category = val; 
              break; 
          } 
      }
      
      openTxModal(type);
      document.getElementById('tx-amount').value = amount || ''; 
      document.getElementById('tx-category').value = category; 
      document.getElementById('tx-method').value = method; 
      document.getElementById('tx-desc').value = text; 
      document.getElementById('tx-notes').value = "Added via Voice Assistant";
    }

    function sortTable(col) { 
        sortAsc = (sortCol === col) ? !sortAsc : true;

            let valA = a[col]; 
            let valB = b[col]; 
            if (col === 'amount') { valA = parseFloat(valA); valB = parseFloat(valB); } 
            return (valA < valB ? -1 : (valA > valB ? 1 : 0)) * (sortAsc ? 1 : -1); 
        }); 
        
        document.getElementById('records-table-container').innerHTML = renderTableHTML(ledger, '', true); 
    }

    // --- VIEW 3: SPEND ANALYZER ---
    function renderAnalyzer() {
      const aggA = {}; 
      const aggB = {};
      
      ledger.forEach(t => { 
          if (t.type === 'DEBIT') { 
              if (t.date.startsWith(selectedMonthA)) aggA[t.category] = (aggA[t.category] || 0) + t.amount; 
              if (t.date.startsWith(selectedMonthB)) aggB[t.category] = (aggB[t.category] || 0) + t.amount; 
          } 
      });
      
      const allCats = [...new Set([...Object.keys(aggA), ...Object.keys(aggB)])];
      
      let compRows = allCats.map(c => { 
          const valA = aggA[c] || 0; 
          const valB = aggB[c] || 0; 
          const diff = valB - valA; 
          let diffStr = `<span>0</span>`; 
          
          if (diff > 0) diffStr = `<span style="color:var(--red);">+${diff.toLocaleString()}</span>`; 
          else if (diff < 0) diffStr = `<span style="color:var(--green);">${diff.toLocaleString()}</span>`; 
          
          return `<tr><td>${c}</td><td>${valA.toLocaleString()}</td><td>${valB.toLocaleString()}</td><td>${diffStr}</td></tr>`; 
      }).join('');

      if (!compRows) compRows = `<tr><td colspan="4" style="text-align:center;">No data for selected months.</td></tr>`;

      return `
        <div class="panel">
          <div class="panel-head">
            <h3>Month-over-Month Comparison</h3>
            <div style="display:flex; gap:10px;">
              <input type="month" id="cmp-month-a" class="input-field" value="${selectedMonthA}" onchange="updateAnalyzerMonths()">
              <span style="align-self:center;">vs</span>
              <input type="month" id="cmp-month-b" class="input-field" value="${selectedMonthB}" onchange="updateAnalyzerMonths()">
            </div>
          </div>
          <div class="table-responsive">
            <table style="margin-bottom: 24px;">
              <thead>
                <tr><th>Category</th><th>Month A</th><th>Month B</th><th>Difference</th></tr>
              </thead>
              <tbody>${compRows}</tbody>
            </table>
          </div>
          
          <div class="panel-head"><h3>Selected Month (B) Distribution</h3></div>
          <div class="chart-container" style="height:250px;"><canvas id="analyzerChart"></canvas></div>
        </div>
      `;
    }
    
    function updateAnalyzerMonths() { 
        selectedMonthA = document.getElementById('cmp-month-a').value; 
        selectedMonthB = document.getElementById('cmp-month-b').value; 
        navigate('analyzer'); 
    }
    
    function renderAnalyzerChart() { 
        const ctx = document.getElementById('analyzerChart'); 
        if (!ctx || typeof Chart === 'undefined') return; 
        
        const agg = {}; 
        ledger.filter(t => t.type === 'DEBIT' && t.date.startsWith(selectedMonthB)).forEach(t => { 
            agg[t.category] = (agg[t.category] || 0) + t.amount; 
        }); 
        
        new Chart(ctx, { 
            type: 'doughnut', 
            data: { 
                labels: Object.keys(agg), 
                datasets: [{ 
                    data: Object.values(agg), 
                    backgroundColor: ['#4f6bf7', '#2ed573', '#ff5263', '#fbc531', '#a55eea', '#45aaf2'] 
                }] 
            }, 
            options: {

    // --- VIEW 4: BUDGET TRACKER ---
    function renderBudget() {
      let totalIncome = ledger.filter(t => t.type === 'CREDIT' && t.date.startsWith('2026-09')).reduce((s, t) => s + t.amount, 0); 
      if(totalIncome === 0) totalIncome = 68000; 
      
      let budgetHTML = Object.keys(budgets).map(cat => {
        const b = budgets[cat]; 
        const target = b.type === 'Percentage' ? (totalIncome * b.val / 100) : b.val; 
        const spent = ledger.filter(t => t.type === 'DEBIT' && t.category === cat && t.date.startsWith('2026-09')).reduce((s,t) => s + t.amount, 0);
        
        const pct = target > 0 ? Math.round((spent / target) * 100) : 0; 
        let color = 'var(--green)'; 
        
        if (pct > 100) color = 'var(--red)'; 
        else if (pct > 85) color = 'var(--warn)';
        
        const remains = target - spent;

        return `
          <div class="budget-row">
            <div class="budget-info">
              <div><strong>${cat}</strong> <span style="color:var(--muted); font-size:11px; margin-left:6px;">${b.type}</span></div>
              <div>${spent.toLocaleString()} / ${target.toLocaleString()} <span style="color:${color}; font-weight:700;">${pct}%</span></div>
            </div>
            <div class="bar-bg">
                <div class="bar-fill" style="width:${Math.min(pct, 100)}%; background:${color};"></div>
            </div>
            <div style="font-size:11px; color:var(--muted); margin-top:4px; text-align:right;">
              ${remains < 0 ? `<span style="color:var(--red)">Over budget by ${Math.abs(remains)}</span>` : `${remains} remaining`}
            </div>
          </div>`;
      }).join('');

      return `
        <div class="panel">
          <div class="panel-head">
            <h3>Monthly Allocations</h3>
            <button class="btn primary" onclick="openBudgetModal()">+ Edit / Add Budget</button>
          </div>

        </div>`;
    }

    // New Function: Import and Merge JSON Backup from another device
    function importFullBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          
          if (importedData.ledger) {
            const existingIds = new Set(ledger.map(t => String(t.id).trim()));
            let added = 0;
            
            importedData.ledger.forEach(t => {
              if (!existingIds.has(String(t.id).trim())) {
                if (t.date && t.date.includes('T')) t.date = t.date.split('T')[0];
                ledger.push(t);
                added++;
              }
            });
            
            ledger = deduplicateLedger(ledger);
            localStorage.setItem('core_ledger', JSON.stringify(ledger));
            
            if (importedData.budgets) {
              budgets = importedData.budgets;
              localStorage.setItem('core_budgets', JSON.stringify(budgets));
            }
            if (importedData.reminders) {
              const existingRemIds = new Set(reminders.map(r => String(r.id).trim()));
              importedData.reminders.forEach(r => {
                  if (!existingRemIds.has(String(r.id).trim())) {
                      if (r.date && r.date.includes('T')) r.date = r.date.split('T')[0];
                      reminders.push(r);
                  }
              });
              reminders = deduplicateReminders(reminders);
              localStorage.setItem('core_reminders', JSON.stringify(reminders));
            }
            if (importedData.users) {
              users = [...new Set([...users, ...importedData.users])];
              localStorage.setItem('core_users', JSON.stringify(users));
            }
            
            alert(`✅ Backup Restored: Merged ${added} new transactions. They will now sync to the cloud in the background.`);
            navigate('records');
            
            if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("http")) backgroundSync();

          } else {
            alert("Invalid backup file format.");
          }
        } catch (err) {
          alert("Error reading backup file: " + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = ''; // Reset input
    }
    
    function exportCSV() {
      const period = document.getElementById('export-period').value; 
      let filtered = ledger; 
      const now = new Date();
      
      if (period !== 'ALL') { 
          filtered = ledger.filter(t => { 
              const tDate = new Date(t.date); 
              if (period === 'CUR_MONTH') return t.date.startsWith('2026-09'); 
              if (period === 'LAST_3_MONTHS') return (now - tDate) <= (90 * 24 * 60 * 60 * 1000); 
              if (period === 'LAST_6_MONTHS') return (now - tDate) <= (180 * 24 * 60 * 60 * 1000); 
              if (period === 'LAST_1_YEAR') return (now - tDate) <= (365 * 24 * 60 * 60 * 1000); 
              return true; 
          }); 
      }
      
      if (filtered.length === 0) return alert("No transactions available for this period.");
      
      const headers = ['Date', 'Type', 'Category', 'Description', 'Method', 'Amount', 'User', 'Notes']; 
      const rows = filtered.map(t => [t.date, t.type, t.category, `"${t.desc}"`, t.method || '', t.amount, t.user, `"${t.notes || ''}"`]);
      
      const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n'); 
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); 
      const url = URL.createObjectURL(blob); 
      const link = document.createElement("a"); 
      
      link.href = url; 
      link.download = `Enterprise_Statement_${period}.csv`; 
      document.body.appendChild(link); 
      link.click(); 
      document.body.removeChild(link);
    }
    
    function processImport() {
      const text = document.getElementById('import-text').value; 
      const method = document.getElementById('import-method').value; 
      
      if (!text.trim()) return alert('Please paste some text to import.');

      const lines = text.split('\n'); 
      let addedCount = 0;
      
      const catMap = { 
          'zomato': 'Dining Out', 'swiggy': 'Dining Out', 'restaurant': 'Dining Out', 'food': 'Dining Out', 
          'amazon': 'Groceries', 'flipkart': 'Groceries', 'supermarket': 'Groceries', 'mart': 'Groceries', 
          'uber': 'Fuel / Petrol', 'ola': 'Fuel / Petrol', 'petrol': 'Fuel / Petrol', 'fuel': 'Fuel / Petrol', 
          'airtel': 'Utility Bills', 'jio': 'Utility Bills', 'electricity': 'Electricity (EB)', 'tneb': 'Electricity (EB)', 
          'hospital': 'Medical / Pharmacy', 'pharmacy': 'Medical / Pharmacy', 'clinic': 'Medical / Pharmacy', 
          'lic': 'LIC Payment', 'insurance': 'LIC Payment', 
          'salon': 'Saloon / Parlour', 'parlour': 'Saloon / Parlour', 'hair': 'Saloon / Parlour', 
          'salary': 'Salary Received', 'payroll': 'Salary Received', 
          'emi': 'Loan', 'loan': 'Loan' 
      };
      
      const sessionData = JSON.parse(localStorage.getItem('core_user') || '{}'); 
      const user = sessionData.name || 'Admin';
      
      lines.forEach(line => {
        if (!line.trim()) return;
        
        let dateMatch = line.match(/(\d{1,4})[-/.](\d{1,2})[-/.](\d{1,4})/); 
        let dateStr = new Date().toISOString().slice(0, 10);
        
        if (dateMatch) { 
            let part1 = dateMatch[1], part2 = dateMatch[2], part3 = dateMatch[3]; 
            if (part1.length === 4) { part3 = part1; part1 = dateMatch[3]; } 
            else if (part3.length === 2) { part3 = '20' + part3; } 
            dateStr = `${part3}-${part2.padStart(2, '0')}-${part1.padStart(2, '0')}`; 
        }
        
        let amtMatch = line.match(/(?:(?:Rs\.?|INR|₹|\$)?\s?)?([\d,]+(?:\.\d+)?)(?:\s?(Cr|Dr|cr|dr))?/g); 
        let amount = 0; 
        let isCredit = false;
        
        if (amtMatch && amtMatch.length > 0) { 
            let lastAmt = amtMatch[amtMatch.length - 1]; 
            if (lastAmt.toLowerCase().includes('cr')) isCredit = true; 
            amount = parseFloat(lastAmt.replace(/[^\d.]/g, '')); 
        }
        
        if (!amount || isNaN(amount)) return;
        
        let desc = line.replace(/(\d{1,4})[-/.](\d{1,2})[-/.](\d{1,4})/, '').replace(/(?:(?:Rs\.?|INR|₹|\$)?\s?)?([\d,]+(?:\.\d+)?)(?:\s?(Cr|Dr|cr|dr))?/g, '').trim(); 
        if (!desc) desc = 'Imported Transaction';
        
        let category = isCredit ? 'Reimbursement' : 'Other Expense'; 
        let lowerDesc = desc.toLowerCase();
        
        for (const [key, val] of Object.entries(catMap)) { 
            if (lowerDesc.includes(key)) { 
                category = val; 
                if (incCategories.includes(val)) isCredit = true; 
                break; 
            } 
        }
        
        if (!isCredit && category === 'Reimbursement') category = 'Other Expense';
        
        ledger.unshift({ 
            id: 'tx_imp_' + Date.now() + Math.floor(Math.random()*1000), 
            date: dateStr, 
            type: isCredit ? 'CREDIT' : 'DEBIT', 
            category: category, 
            method: method, 
            desc: desc.substring(0, 50), 
            notes: 'Auto-Imported', 
            amount: amount, 
            user: user 
        });
        addedCount++;
      });
      
      if (addedCount > 0) { 
          ledger = deduplicateLedger(ledger);
          localStorage.setItem('core_ledger', JSON.stringify(ledger)); 
          alert(`Successfully imported ${addedCount} transactions locally. They will now sync to the cloud in the background.`); 
          document.getElementById('import-text').value = ''; 
          if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("http")) backgroundSync();
      } else { 
          alert('Could not find recognizable dates or amounts. Ensure text contains dates (DD/MM/YYYY) and numbers.'); 
      }
    }

      btn.innerText = 'Saving...';
      
      const id = document.getElementById('tx-id').value || 'tx_' + String(Date.now());
      const isEdit = document.getElementById('tx-id').value !== '';
      const rawDate = document.getElementById('tx-date').value;
      
      const record = { 
          id: id, 
          date: rawDate.split('T')[0], 
          type: document.getElementById('tx-type').value, 
          category: document.getElementById('tx-category').value, 
          method: document.getElementById('tx-method').value, 
          desc: document.getElementById('tx-desc').value, 
          notes: document.getElementById('tx-notes').value, 
          amount: parseFloat(document.getElementById('tx-amount').value), 
          user: document.getElementById('tx-user').value 
      };
      
      const idx = ledger.findIndex(x => String(x.id).trim() === String(id).trim()); 
      if (idx >= 0) ledger[idx] = record; 
      else ledger.unshift(record);
      
      ledger = deduplicateLedger(ledger); 
      localStorage.setItem('core_ledger', JSON.stringify(ledger)); 
      closeModal('tx-modal');
      
      btn.disabled = false;
      btn.innerText = 'Save Transaction';
      
      const activeNav = document.querySelector('.nav-item.active').innerText; 
      if(activeNav.includes('Records')) navigate('records'); 
      else navigate('overview');

      if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("http")) {
          try {
              await apiPost(isEdit ? 'editTransaction' : 'addTransaction', record);
          } catch (err) { 
              console.error("Background sync save failed:", err); 
          }
      }
    }
    
    function closeModal(modalId) { 
        document.getElementById(modalId).style.display = 'none'; 
    }

    // --- REUSABLE HTML GENERATORS ---
    function renderTableHTML(data, title, sortable) {
      const th = (lbl, col) => sortable ? `<th onclick="sortTable('${col}')">${lbl} ${sortCol===col ? (sortAsc?'↑':'↓') : ''}</th>` : `<th>${lbl}</th>`;
      
      return `
        ${title ? `<div class="panel-head"><h3>${title}</h3></div>` : ''}
        <div class="table-responsive">
          <table>
            <thead>
                <tr>
                    ${th('Date','date')} 
                    ${th('Type','type')} 
                    ${th('Category','category')} 
                    ${th('Description','desc')} 
                    ${th('Amount','amount')} 
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
              ${data.length === 0 ? '<tr><td colspan="6" style="text-align:center;">No records found.</td></tr>' : ''}
              ${data.map(t => {
                  const displayDate = t.date ? t.date.split('T')[0] : '';
                  return `
                  <tr>
                      <td>${displayDate}</td>
                      <td><span class="badge ${t.type.toLowerCase()}">${t.type}</span></td>
                      <td>${t.category}</td>
                      <td>${t.desc}</td>
                      <td style="font-weight:700; color:${t.type==='CREDIT'?'var(--green)':'var(--red)'};">
                          ${t.type==='CREDIT'?'+':'-'} ${parseFloat(t.amount).toLocaleString()}
                      </td>
                      <td>
                          <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="editTx('${t.id}')">✎ Edit</button> 
                          <button class="btn" style="padding:4px 8px; font-size:11px; color:var(--red);" onclick="deleteTx('${t.id}')">🗑 Delete</button>
                      </td>
                  </tr>`
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // Launch App Directly with Optimistic UI
    window.addEventListener('DOMContentLoaded', bootApp);
  </script>
</body>
</html>
